services:
  storage-init:
    image: busybox:1.37
    user: "0:0"
    command: ["chown", "-R", "65532:65532", "/storage/data", "/storage/uploads"]
    volumes:
      - ./data:/storage/data
      - ./static/uploads:/storage/uploads

  colday_app:
    build: .
    container_name: colday_app
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/colday_app/data
      - ./static/uploads:/colday_app/static/uploads
